<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>K8: Tính Chỉ Số BMI và Phân Loại</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; }
        .box { background: #f9f9f9; padding: 20px; border: 1px solid #ddd; border-radius: 5px; }
        input { padding: 8px; width: 100%; margin: 8px 0 15px 0; box-sizing: border-box; }
        button { padding: 10px; background: #3498db; color: white; border: none; cursor: pointer; border-radius: 4px; width: 100%; font-weight: bold; }
        button:hover { background: #2980b9; }
        #bmiResult { margin-top: 15px; font-weight: bold; font-size: 16px; color: #2c3e50; }
        .back-link { display: inline-block; margin-bottom: 20px; text-decoration: none; color: #3498db; font-weight: bold; }
    </style>
</head>
<body>
    <a href="42.html" class="back-link">&larr; Quay lại trang chủ</a>
    <h2>K8: Tính Chỉ Số BMI và Phân Loại</h2>

    <div class="box">
        <label>Cân nặng (kg):</label>
        <input type="number" id="weight" step="0.1" placeholder="Ví dụ: 60">
        
        <label>Chiều cao (m):</label>
        <input type="number" id="height" step="0.01" placeholder="Ví dụ: 1.70">
        
        <button onclick="tinhBMI()">Tính BMI</button>
        <p id="bmiResult"></p>
    </div>

    <script>
        function tinhBMI() {
            let w = parseFloat(document.getElementById("weight").value);
            let h = parseFloat(document.getElementById("height").value);
            let resultEl = document.getElementById("bmiResult");

            if (isNaN(w) || isNaN(h) || w <= 0 || h <= 0) {
                resultEl.innerText = "Vui lòng nhập cân nặng và chiều cao hợp lệ!";
                return;
            }

            let bmi = w / (h * h);
            let classification = "";

            if (bmi < 18.5) {
                classification = "Gầy (Thiếu cân)";
            } else if (bmi < 25) {
                classification = "Bình thường (Cân đối)";
            } else if (bmi < 30) {
                classification = "Thừa cân";
            } else {
                classification = "Béo phì";
            }

            resultEl.innerHTML = `Chỉ số BMI của bạn là: <b>${bmi.toFixed(2)}</b><br>Phân loại: <span style="color: #e74c3c;">${classification}</span>`;
        }
    </script>
</body>
</html>
